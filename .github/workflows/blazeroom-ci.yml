name: blazeroom-ci

on:
  push:
    branches: [blazeroom]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx eslint src/app/features/friends src/app/pages/client/sidebar/FriendsTab.tsx src/element-call src/app/components/toast src/app/components/invite-user-prompt/inviteUserId.ts src/app/components/invite-user-prompt/inviteUserId.test.ts src/app/features/admin src/app/features/settings/admin src/app/features/invites src/app/utils/blazeroomApi.ts src/app/features/word-swap src/app/features/space-autojoin src/app/features/room-nav/CallMemberAvatars.tsx src/app/features/room-nav/callMembers.ts src/app/features/room-nav/callMembers.test.ts
      - run: npx prettier --check src/app/features/friends src/app/pages/client/sidebar/FriendsTab.tsx src/element-call src/app/components/toast src/app/components/invite-user-prompt/inviteUserId.ts src/app/components/invite-user-prompt/inviteUserId.test.ts src/app/features/admin src/app/features/settings/admin src/app/features/invites src/app/utils/blazeroomApi.ts src/app/features/word-swap src/app/features/space-autojoin src/app/features/room-nav/CallMemberAvatars.tsx src/app/features/room-nav/callMembers.ts src/app/features/room-nav/callMembers.test.ts
      - name: Typecheck (our files only)
        run: |
          npx tsc --noEmit > tsc.log || true
          if grep -E "src/app/features/friends/|src/app/pages/client/sidebar/FriendsTab.tsx|src/element-call/|src/app/components/toast/|invite-user-prompt/inviteUserId|src/app/features/admin/|src/app/features/settings/admin/|src/app/features/invites/|src/app/utils/blazeroomApi|src/app/features/word-swap/(wordSwap|WordSwapEffect)|space-autojoin/spaceAutoJoin|room-nav/callMembers" tsc.log; then exit 1; fi
